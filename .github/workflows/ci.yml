name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verifier:
    name: Vérifier les données et le plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/boussole-presidentielle-2027
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fiches candidats valides
        run: python3 scripts/check_data.py --jours 100000

      - name: Tirage des questions
        run: |
          python3 scripts/tirage.py --mode rapide --graine 2027 < /dev/null > /tmp/t1.json
          python3 scripts/tirage.py --mode rapide --graine 2027 < /dev/null > /tmp/t2.json
          cmp /tmp/t1.json /tmp/t2.json
          python3 - <<'PY'
          import json
          t = json.load(open("/tmp/t1.json"))
          assert len(t["questions"]) == 12 and not t["fin"], "mode rapide : 12 questions attendues"
          print(" / ".join(q["enjeu"] for q in t["questions"]))
          PY
          echo '{"reponses": {"eco_retraite": 1, "sec_cannabis": null}}' | python3 scripts/tirage.py --mode adaptatif --graine 2027 > /dev/null

      - name: Calcul des scores
        run: |
          python3 scripts/score.py <<'FIN' | tee /tmp/score.txt
          {"reponses": {"eco_retraite": 2, "imm_baisse": -2, "eur_ukraine": 1, "sec_cannabis": null}, "importance": {"economie": 2}}
          FIN
          grep -q "| 1 |" /tmp/score.txt
          grep -q " ± " /tmp/score.txt

      - name: Tests du calcul
        working-directory: .
        run: python3 -m unittest discover -s tests -v

      - name: Audit de neutralité (informatif)
        # Ne fait jamais échouer la CI : le rapport est publié dans le résumé du job.
        continue-on-error: true
        run: python3 scripts/audit_biais.py >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Manifeste du plugin et de la marketplace
        working-directory: .
        run: npx --yes @anthropic-ai/claude-code@2.1.252 plugin validate --strict ./
